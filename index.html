<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Terrified Monkes</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script>
window.isGameOver = false;

/* ---------- Gorilla Tag style arm-swing locomotion (lives on the rig) ---------- */
AFRAME.registerComponent('gtag-locomotion', {
  schema: {
    radius:   {default: 0.12},  // hand collision sphere
    maxSpeed: {default: 7},
    jump:     {default: 1.15},  // push multiplier when you let go of a surface
    gravity:  {default: -9.8},
    drag:     {default: 0.15}
  },
  init: function () {
    this.vel = new THREE.Vector3();
    this.boxes = [];
    this.tmp = new THREE.Vector3();
    this.hands = ['#left-hand', '#right-hand'].map(sel => ({
      el: document.querySelector(sel), last: new THREE.Vector3(), vel: new THREE.Vector3(), ready: false
    }));
    this.el.sceneEl.addEventListener('loaded', () => this.collectSolids());
    // Desktop test mode: click to launch toward where you look
    window.addEventListener('mousedown', () => {
      if (this.el.sceneEl.is('vr-mode') || window.isGameOver) return;
      const d = new THREE.Vector3();
      this.el.sceneEl.camera.getWorldDirection(d);
      d.y = 0; d.normalize().multiplyScalar(4);
      d.y = 4.5;
      this.vel.add(d);
    });
  },
  collectSolids: function () {
    this.boxes = [];
    document.querySelectorAll('.solid').forEach(el => {
      el.object3D.updateMatrixWorld(true);
      this.boxes.push(new THREE.Box3().setFromObject(el.object3D));
    });
  },
  // Returns a push-out vector if sphere at p touches floor/solids, else null
  collide: function (p) {
    const r = this.data.radius, out = new THREE.Vector3(); let hit = false;
    if (p.y - r < 0) { out.y += r - p.y; hit = true; }
    for (const b of this.boxes) {
      const c = b.clampPoint(p, new THREE.Vector3());
      const d = p.clone().sub(c), len = d.length();
      if (len < r) {
        hit = true;
        if (len > 1e-5) out.add(d.multiplyScalar((r - len) / len));
        else out.y += b.max.y + r - p.y;           // hand is inside the box: push up
      }
    }
    return hit ? out : null;
  },
  tick: function (time, delta) {
    if (window.isGameOver || !delta) return;
    const dt = Math.min(delta / 1000, 0.05), rig = this.el.object3D.position, vr = this.el.sceneEl.is('vr-mode');
    let touching = 0; const shift = new THREE.Vector3(), push = new THREE.Vector3();

    if (vr) {
      for (const h of this.hands) {
        const local = h.el.object3D.position;
        if (!h.ready) { h.last.copy(local); h.ready = true; continue; }
        const delta3 = local.clone().sub(h.last);                    // hand motion relative to body
        h.vel.lerp(delta3.clone().divideScalar(dt), 0.5);            // smoothed hand velocity
        h.last.copy(local);
        // would the hand touch something after the body moves to cancel its motion?
        const world = rig.clone().sub(delta3).add(local);
        const corr = this.collide(world);
        if (corr) {
          touching++;
          shift.add(delta3.negate()).add(corr);                      // hand "sticks": body moves opposite
          push.sub(h.vel);                                           // launch direction = opposite of swing
        }
      }
    }

    if (touching) {
      rig.add(shift.divideScalar(touching));
      this.vel.copy(push.divideScalar(touching).multiplyScalar(this.data.jump));
    } else {
      this.vel.y += this.data.gravity * dt;
      this.vel.multiplyScalar(1 - this.data.drag * dt);
      rig.addScaledVector(this.vel, dt);
      if (!vr && rig.y < 0) { rig.y = 0; this.vel.set(this.vel.x * 0.9, 0, this.vel.z * 0.9); }
    }
    if (this.vel.length() > this.data.maxSpeed) this.vel.setLength(this.data.maxSpeed);
    if (rig.y < -30) { rig.set(0, 0, 0); this.vel.set(0, 0, 0); }   // fell off the world
  }
});

/* ---------- Procedural brick / concrete textures (with bump maps for depth) ---------- */
const TEX_CACHE = {};
function makeTexture(kind) {
  if (TEX_CACHE[kind]) return TEX_CACHE[kind];
  const mk = () => { const c = document.createElement('canvas'); c.width = c.height = 256; return c; };
  const col = mk(), hgt = mk(), g = col.getContext('2d'), h = hgt.getContext('2d');
  const rnd = (a, b) => a + Math.random() * (b - a);
  if (kind === 'brick') {
    g.fillStyle = '#a49d90'; g.fillRect(0, 0, 256, 256);                 // mortar
    h.fillStyle = '#101010'; h.fillRect(0, 0, 256, 256);                 // mortar sits deep
    for (let n = 0; n < 1500; n++) {                                     // mortar grit
      g.fillStyle = `rgba(${rnd(60,200)|0},${rnd(60,190)|0},${rnd(50,170)|0},0.35)`;
      g.fillRect(rnd(0, 256), rnd(0, 256), 1, 1);
    }
    for (let row = 0; row < 4; row++) {
      for (let i = -1; i < 3; i++) {
        const x = i * 128 + (row % 2 ? 64 : 0) + 4, y = row * 64 + 5, w = 120, ht = 54;
        const r = rnd(120, 180), gr = rnd(45, 85), b = rnd(35, 65);
        g.fillStyle = `rgb(${r|0},${gr|0},${b|0})`; g.fillRect(x, y, w, ht);
        h.fillStyle = `rgb(${rnd(170,215)|0},${rnd(170,215)|0},${rnd(170,215)|0})`; h.fillRect(x, y, w, ht);
        for (let n = 0; n < 500; n++) {                                  // rough grain, light and dark
          const light = Math.random() < 0.3, a = rnd(0.05, 0.22), sz = rnd(1, 3.5);
          g.fillStyle = light ? `rgba(255,170,130,${a})` : `rgba(20,5,0,${a})`;
          g.fillRect(x + rnd(0, w), y + rnd(0, ht), sz, sz);
          h.fillStyle = light ? 'rgba(255,255,255,0.25)' : 'rgba(0,0,0,0.3)';
          h.fillRect(x + rnd(0, w), y + rnd(0, ht), sz, sz);
        }
        for (let n = 0; n < 3; n++) {                                    // chips and pits
          const cx = x + rnd(2, w - 8), cy = y + rnd(2, ht - 8), cw = rnd(3, 9), ch = rnd(3, 7);
          g.fillStyle = 'rgba(30,12,5,0.55)'; g.fillRect(cx, cy, cw, ch);
          h.fillStyle = 'rgba(0,0,0,0.6)'; h.fillRect(cx, cy, cw, ch);
        }
        g.fillStyle = 'rgba(255,220,190,0.18)'; g.fillRect(x, y, w, 3); g.fillRect(x, y, 3, ht);   // lit edges
        g.fillStyle = 'rgba(0,0,0,0.3)'; g.fillRect(x, y + ht - 3, w, 3); g.fillRect(x + w - 3, y, 3, ht); // shaded edges
      }
    }
  } else {                                                               // concrete
    g.fillStyle = '#8e8e8b'; g.fillRect(0, 0, 256, 256);
    h.fillStyle = '#808080'; h.fillRect(0, 0, 256, 256);
    for (let n = 0; n < 5000; n++) {
      const v = rnd(105, 180) | 0, sz = rnd(1, 4);
      g.fillStyle = `rgba(${v},${v},${v - 3},${rnd(0.15, 0.45)})`;
      g.fillRect(rnd(0, 256), rnd(0, 256), sz, sz);
      const k = rnd(60, 200) | 0;
      h.fillStyle = `rgba(${k},${k},${k},0.4)`; h.fillRect(rnd(0, 256), rnd(0, 256), sz, sz);
    }
    for (let n = 0; n < 6; n++) {                                        // stains
      const cx = rnd(0, 256), cy = rnd(0, 256), gr = g.createRadialGradient(cx, cy, 2, cx, cy, rnd(20, 50));
      gr.addColorStop(0, 'rgba(60,60,55,0.14)'); gr.addColorStop(1, 'rgba(60,60,55,0)');
      g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
    }
    g.strokeStyle = 'rgba(40,40,40,0.5)'; g.lineWidth = 2; g.strokeRect(1, 1, 254, 254);   // panel seams
    h.strokeStyle = '#000'; h.lineWidth = 3; h.strokeRect(1, 1, 254, 254);
    g.strokeStyle = 'rgba(40,40,40,0.35)'; h.strokeStyle = 'rgba(0,0,0,0.6)'; g.lineWidth = h.lineWidth = 1;
    g.beginPath(); h.beginPath(); let x = rnd(40, 200), y = 0; g.moveTo(x, y); h.moveTo(x, y);
    while (y < 256) { x += rnd(-10, 10); y += rnd(10, 25); g.lineTo(x, y); h.lineTo(x, y); }
    g.stroke(); h.stroke();
  }
  const t = new THREE.CanvasTexture(col), bt = new THREE.CanvasTexture(hgt);
  for (const x of [t, bt]) { x.wrapS = x.wrapT = THREE.RepeatWrapping; x.anisotropy = 4; }
  t.colorSpace = THREE.SRGBColorSpace;
  return (TEX_CACHE[kind] = {map: t, bump: bt});
}
AFRAME.registerComponent('proc-tex', {
  // size = metres per tile. repeat = force exact tile counts (use on big flat floors/roofs)
  schema: {kind: {default: 'brick'}, size: {default: 1.5}, repeat: {type: 'vec2', default: {x: 0, y: 0}}},
  init: function () {
    const apply = () => {
      const mesh = this.el.getObject3D('mesh'), geo = this.el.components.geometry;
      if (!mesh || !geo) return;
      const d = geo.data, T = makeTexture(this.data.kind), m = T.map.clone(), bm = T.bump.clone();
      const rx = this.data.repeat.x || Math.max(1, Math.max(d.width, d.depth || 1) / this.data.size);
      const ry = this.data.repeat.y || Math.max(1, (d.height || 1) / this.data.size);
      for (const t of [m, bm]) { t.repeat.set(rx, ry); t.needsUpdate = true; }
      mesh.material.map = m; mesh.material.bumpMap = bm; mesh.material.bumpScale = 2;
      mesh.material.color.set('#ffffff'); mesh.material.needsUpdate = true;
    };
    if (this.el.hasLoaded) apply(); else this.el.addEventListener('loaded', apply);
  }
});

/* ---------- Hide the white controller-hand model (hand tracking still works) ---------- */
AFRAME.registerComponent('no-hand-model', {
  init: function () {
    const hide = () => { const m = this.el.getObject3D('mesh'); if (m) m.visible = false; };
    this.el.addEventListener('model-loaded', hide);
    this.el.addEventListener('object3dset', hide);
  }
});

/* ---------- Player model that follows your head ---------- */
AFRAME.registerComponent('gtag-avatar', {
  schema: {height: {default: 0.7}, yawOffset: {default: 0}, drop: {default: 0.5}},
  init: function () {
    this.cam = document.querySelector('#camera');
    this.el.addEventListener('model-loaded', () => {
      const m = this.el.getObject3D('mesh'); if (!m) return;
      let box = new THREE.Box3().setFromObject(m), size = box.getSize(new THREE.Vector3());
      m.scale.multiplyScalar(this.data.height / size.y);             // normalise size
      box.setFromObject(m);
      m.position.sub(box.getCenter(new THREE.Vector3()));            // centre on entity origin
      m.traverse(o => {                                              // fur = Material.003 (body + arms); face and eyes keep their colors
        if (!o.isMesh || !o.material || !/003/.test(o.material.name)) return;
        o.material = o.material.clone(); o.material.map = null;
        o.material.color.set('#2a62ff'); o.material.emissive && o.material.emissive.set('#0a1f66');
        o.material.needsUpdate = true;
      });
    });
  },
  tick: function () {
    const c = this.cam.object3D, o = this.el.object3D;
    o.position.set(c.position.x, c.position.y - this.data.drop, c.position.z);
    o.rotation.set(0, new THREE.Euler().setFromQuaternion(c.quaternion, 'YXZ').y +
      THREE.MathUtils.degToRad(this.data.yawOffset), 0);
  }
});

/* ---------- HORROR: flickering lights, stalking monster, procedural audio ---------- */
AFRAME.registerComponent('flicker', {
  schema: {base: {default: 0.8}},
  tick: function (t) {
    if (this.next && t < this.next) return;
    const L = this.el.getObject3D('light'); if (!L) return;
    const dead = Math.random() < 0.3;
    L.intensity = dead ? Math.random() * 0.1 : this.data.base;
    this.next = t + (dead ? 40 + Math.random() * 120 : 300 + Math.random() * 2500);
  }
});

AFRAME.registerComponent('stalker', {
  schema: {speed: {default: 1.5}, kill: {default: 0.9}, delay: {default: 8000}},
  init: function () { this.cam = document.querySelector('#camera'); this.p = new THREE.Vector3(); },
  tick: function (time, delta) {
    if (window.isGameOver || !delta || time < this.data.delay) return;
    const dt = delta / 1000, o = this.el.object3D.position, p = this.p;
    this.cam.object3D.getWorldPosition(p);
    const dx = p.x - o.x, dz = p.z - o.z, dist = Math.hypot(dx, dz);
    const sp = this.data.speed * (1 + Math.min((time - this.data.delay) / 120000, 1));  // gets faster over 2 min
    if (dist > 0.01) { o.x += dx / dist * sp * dt; o.z += dz / dist * sp * dt; }
    o.y = Math.abs(Math.sin(time / 260)) * 0.08;                          // creepy bob
    this.el.object3D.rotation.y = Math.atan2(dx, dz);                     // face the player
    if (dist < this.data.kill && p.y < 2.8) window.triggerPlayerDeath('IT FOUND YOU');   // fly above it to be safe
  }
});

window.horrorAudio = (function () {
  let ac, master;
  function noise(dur, freq, q, vol) {
    const b = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = b; f.type = 'bandpass'; f.frequency.setValueAtTime(freq, ac.currentTime);
    f.frequency.linearRampToValueAtTime(freq * 0.4, ac.currentTime + dur); f.Q.value = q; g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(master); src.start();
  }
  return {
    start: function () {
      if (ac) { ac.resume(); return; }
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = 1; master.connect(ac.destination);
      const lp = ac.createBiquadFilter(), g = ac.createGain(); lp.type = 'lowpass'; lp.frequency.value = 170; g.gain.value = 0.07;
      [48, 49.3, 96.5].forEach(f => { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.connect(lp); o.start(); });
      lp.connect(g); g.connect(master);                                    // low dark drone
      (function creak() { noise(0.6 + Math.random(), 300 + Math.random() * 500, 12, 0.18); setTimeout(creak, 5000 + Math.random() * 9000); })();
    },
    scream: function () {
      if (!ac) return;
      noise(1.4, 2200, 1.5, 0.9);
      const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(900, ac.currentTime); o.frequency.exponentialRampToValueAtTime(180, ac.currentTime + 1.2);
      g.gain.setValueAtTime(0.5, ac.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 1.3);
      o.connect(g); g.connect(master); o.start(); o.stop(ac.currentTime + 1.4);
    }
  };
})();
['mousedown', 'keydown', 'touchstart'].forEach(e => window.addEventListener(e, () => horrorAudio.start()));
document.addEventListener('DOMContentLoaded', () => document.querySelector('a-scene').addEventListener('enter-vr', () => horrorAudio.start()));

window.triggerPlayerDeath = function (message) {
  if (window.isGameOver) return;
  window.isGameOver = true;
  horrorAudio.scream();
  document.querySelector('#death-message').innerText = message;
  document.querySelector('#jumpscare-screen').style.display = 'flex';
};
</script>
</head>
<body style="margin:0;padding:0;overflow:hidden;background:#000;">

<style>@keyframes shake{0%{transform:translate(0,0) scale(1.4)}25%{transform:translate(-30px,20px) scale(1.6)}50%{transform:translate(25px,-25px) scale(1.4)}75%{transform:translate(-20px,-15px) scale(1.6)}100%{transform:translate(0,0) scale(1.4)}}@keyframes flash{0%,40%{background:#a00}20%,60%,100%{background:#000}}#jumpscare-screen{animation:flash .3s 3}#death-message{animation:shake .15s infinite;font-size:4rem;text-align:center}</style>
<div id="jumpscare-screen" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;color:#f00;z-index:9999;font-family:sans-serif;flex-direction:column;justify-content:center;align-items:center;">
  <h1 id="death-message">🚨 GAME OVER 🚨</h1>
  <button onclick="window.location.reload()" style="padding:10px 20px;font-size:1.5rem;background:red;color:#fff;border:none;cursor:pointer;">RESTART</button>
</div>

<a-scene background="color: #000" fog="type: exponential; color: #020203; density: 0.05">
  <a-assets>
    <a-asset-item id="monke" src="gtag_fangame_starter_playermodel.glb"></a-asset-item>
  </a-assets>


  <!-- Room: 30 m long (x), 4 floor squares wide (z = 4 x 1.55 m = 6.2 m), 6 m tall. Spawn is in the middle. -->
  <a-light type="ambient" intensity="0.15" color="#5560a0"></a-light>
  <a-light type="point" flicker="base: 0.7" position="-9 5.5 0" intensity="0.7" color="#ffe0b0" distance="22" decay="1"></a-light>
  <a-light type="point" flicker="base: 0.7" position="9 5.5 0" intensity="0.7" color="#ffe0b0" distance="22" decay="1"></a-light>
  <a-light type="point" flicker="base: 0.5" position="14 3 0" intensity="0.5" color="#ff0000" distance="12" decay="1"></a-light>

  <!-- Concrete floor (top surface at y=0): 20 squares long, 4 squares wide -->
  <a-box class="solid" proc-tex="kind: concrete; repeat: 20 4" position="0 -0.25 0" width="31" height="0.5" depth="6.2" color="#fff"></a-box>
  <!-- Concrete roof -->
  <a-box class="solid" proc-tex="kind: concrete; repeat: 20 4" position="0 6.25 0" width="31" height="0.5" depth="6.2" color="#fff"></a-box>
  <!-- Brick walls -->
  <a-box class="solid" proc-tex="kind: brick" position="0 3 -3.35" width="31" height="6" depth="0.5" color="#fff"></a-box>
  <a-box class="solid" proc-tex="kind: brick" position="0 3 3.35" width="31" height="6" depth="0.5" color="#fff"></a-box>
  <a-box class="solid" proc-tex="kind: brick" position="-15.25 3 0" width="0.5" height="6" depth="6.2" color="#fff"></a-box>
  <a-box class="solid" proc-tex="kind: brick" position="15.25 3 0" width="0.5" height="6" depth="6.2" color="#fff"></a-box>

  <!-- Monster: starts at the far end, hunts you after 8 s. Stay above head height (fly) to dodge it. -->
  <a-entity stalker position="-13 0 0">
    <a-box position="0 1.1 0" width="0.8" height="1.7" depth="0.4" color="#060606"></a-box>
    <a-box position="0 2.2 0" width="0.5" height="0.55" depth="0.45" color="#060606"></a-box>
    <a-box position="-0.55 1.2 0.1" width="0.18" height="1.6" depth="0.18" color="#060606" rotation="8 0 6"></a-box>
    <a-box position="0.55 1.2 0.1" width="0.18" height="1.6" depth="0.18" color="#060606" rotation="8 0 -6"></a-box>
    <a-box position="-0.12 2.25 0.24" width="0.1" height="0.06" depth="0.02" material="color:#f00; shader:flat"></a-box>
    <a-box position="0.12 2.25 0.24" width="0.1" height="0.06" depth="0.02" material="color:#f00; shader:flat"></a-box>
  </a-entity>

  <!-- Player rig -->
  <a-entity id="player" gtag-locomotion position="0 0 0">
    <a-camera id="camera" look-controls wasd-controls="enabled: false" position="0 1.6 0"></a-camera>
    <a-entity gtag-avatar gltf-model="#monke"></a-entity>

    <a-entity id="left-hand" hand-controls="hand: left" no-hand-model>
      <a-sphere radius="0.02" color="#ffb347"></a-sphere>
    </a-entity>
    <a-entity id="right-hand" hand-controls="hand: right" no-hand-model>
      <a-sphere radius="0.02" color="#ffb347"></a-sphere>
    </a-entity>
  </a-entity>
</a-scene>

</body>
</html>
