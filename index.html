<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Gorilla Arena Escape: Final Fixed Build</title>
    
    <!-- Stable production loading for the A-Frame core framework -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>
<body>

    <!-- 1. MAIN 3D SCENE ROOT -->
    <a-scene>
        
        <!-- 2. GAME ASSETS PRELOADER -->
        <a-assets>
            <!-- Preloading your custom Githack Gorilla Tag playermodel -->
            <a-asset-item id="monke-avatar" src="https://githack.com"></a-asset-item>
        </a-assets>

        <!-- 3. ENVIRONMENT LIGHTING & BACKDROP -->
        
        
        <a-sky id="skyBox" color="#1a1a24"></a-sky>
        
        <!-- Main Arena Floor Ground -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="200" height="200" color="#222" metalness="0.4"></a-plane>


        <!-- 4. AREA 1: THE EXTENDED SPAWN LOBBY -->
        <!-- Corridor Walls -->
        <a-box position="-6 4 30" width="0.5" height="8" depth="36" color="#333" metalness="0.7"></a-box>
        <a-box position="6 4 30" width="0.5" height="8" depth="36" color="#333" metalness="0.7"></a-box>
        <a-box position="0 4 48" width="12" height="8" depth="0.5" color="#222" metalness="0.8"></a-box>

        <!-- Door Switch Terminal -->
        <a-box id="unlockButton" position="2 1.2 12.5" width="0.4" height="0.4" depth="0.2" color="#ff0000">
            <a-text value="SLAP TO ESCAPE" position="-0.7 0.4 0.1" scale="0.5 0.5 0.5" color="#fff"></a-text>
        </a-box>

        <!-- SECURITY SLIDING DOOR -->
        <!-- Native animation node triggered instantly when a player hovers or clicks #unlockButton -->
        <a-box id="hallwayDoor" position="0 4 12" width="12" height="8" depth="0.5" color="#444" metalness="0.9"
               animation__open="property: position; to: 0 11 12; dur: 1800; easing: easeOutQuad; startEvents: click; eventTarget: #unlockButton">
        </a-box>


        <!-- 5. AREA 2: THE MONSTER OBSERVATION WINGS (CROSS SECTIONS) -->
        <!-- Left Wing Wingwall -->
        <a-box position="-20 4 -6" width="16" height="8" depth="0.5" color="#2b2b2b"></a-box>
        <a-box position="-20 4 6" width="16" height="8" depth="0.5" color="#2b2b2b"></a-box>
        <a-box position="-28 4 0" width="0.5" height="8" depth="12" color="#111"></a-box>

        <!-- Right Wing Wingwall -->
        <a-box position="20 4 -6" width="16" height="8" depth="0.5" color="#2b2b2b"></a-box>
        <a-box position="20 4 6" width="16" height="8" depth="0.5" color="#2b2b2b"></a-box>
        <a-box position="28 4 0" width="0.5" height="8" depth="12" color="#111"></a-box>


        <!-- 6. AREA 3: THE SPIKE TRAP CORRIDOR -->
        <!-- Main Runway Boundaries -->
        <a-box position="-6 4 -21" width="0.5" height="8" depth="30" color="#2b2b2b"></a-box>
        <a-box position="6 4 -21" width="0.5" height="8" depth="30" color="#2b2b2b"></a-box>
        <a-box position="0 4 -36" width="12" height="8" depth="0.5" color="#222"></a-box> 

        <!-- Hazard Alert Light -->
        

        <!-- LOOPING SPIKED CEILING ASSEMBLY -->
        <!-- Pure HTML looping movement node traveling continuously between Y: 9.0 and Y: 1.2 -->
        <a-box id="spikedCeiling" position="0 9.0 -21" width="11.5" height="1" depth="30" color="#555" metalness="0.8"
               animation__drop="property: position; from: 0 9.0 -21; to: 0 1.2 -21; dur: 2500; dir: alternate; loop: true; easing: easeInQuad">
            <!-- Geometric Low-Poly Spikes attached directly to the base frame -->
            <a-cone position="-3 -1 -10" radius-bottom="0.4" height="1.5" rotation="180 0 0" color="#aaa"></a-cone>
            <a-cone position="3 -1 -10" radius-bottom="0.4" height="1.5" rotation="180 0 0" color="#aaa"></a-cone>
            <a-cone position="-3 -1 0" radius-bottom="0.4" height="1.5" rotation="180 0 0" color="#aaa"></a-cone>
            <a-cone position="0 -1 0" radius-bottom="0.4" height="1.5" rotation="180 0 0" color="#ff0022"></a-cone>
            <a-cone position="3 -1 0" radius-bottom="0.4" height="1.5" rotation="180 0 0" color="#aaa"></a-cone>
            <a-cone position="-3 -1 10" radius-bottom="0.4" height="1.5" rotation="180 0 0" color="#aaa"></a-cone>
            <a-cone position="3 -1 10" radius-bottom="0.4" height="1.5" rotation="180 0 0" color="#aaa"></a-cone>
        </a-box>


        <!-- 7. THE VR PLAYER AVATAR ASSEMBLY -->
         
            <!-- Central Main Sight Camera View -->
            <a-camera id="camera" look-controls>
                <!-- Central Reticle Cursor for selecting the #unlockButton switch node -->
                <a-cursor raycaster="objects: #unlockButton" color="yellow" scale="0.5 0.5 0.5"></a-cursor>
                
                <!-- Sight Attached Spotlight -->
                
            </a-camera>

            <!-- Tracked Controller Entities loading your custom .glb playermodel asset -->
            
                <a-gltf-model src="#monke-avatar" rotation="0 180 0" scale="0.4 0.4 0.5"></a-gltf-model>
            
            
            
                <a-gltf-model src="#monke-avatar" rotation="0 180 0" scale="0.4 0.4 0.5"></a-gltf-model>
            

         <!-- FIXED: Properly terminates the player rig layer -->

    </a-scene> <!-- FIXED: Properly terminates the 3D scene engine layer -->
</body>
</html>
