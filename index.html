<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Terrified Monkes</title>
    <script src="https://unpkg.com"></script>
    <script>
        window.isGameOver = false;

        AFRAME.registerComponent('gtag-physics-locomotion', {
            init: function () {
                this.velocity = new THREE.Vector3(0, 0, 0);
                this.isGrounded = false;
                this.gravity = -9.8;
                this.friction = 0.96;
                window.addEventListener('mousedown', () => {
                    if (!this.el.sceneEl.is('vr-mode') && !window.isGameOver) {
                        this.pushPlayer(new THREE.Vector3(0, 4.5, -5.5));
                    }
                });
            },
            tick: function (time, timeDelta) {
                if (window.isGameOver || !timeDelta) return;
                let dt = timeDelta / 1000;
                let pos = this.el.object3D.position;
                if (!this.isGrounded) this.velocity.y += this.gravity * dt;
                this.velocity.x *= this.friction;
                this.velocity.z *= this.friction;
                pos.addScaledVector(this.velocity, dt);
                if (pos.y <= 0) {
                    pos.y = 0;
                    this.velocity.y = 0;
                    this.isGrounded = true;
                }
            },
            pushPlayer: function(forceVector) {
                if (window.isGameOver) return;
                this.velocity.add(forceVector);
                this.isGrounded = false;
            }
        });

        AFRAME.registerComponent('vr-hand-push-trigger', {
            init: function () {
                this.playerRig = document.querySelector('#player');
                this.lastPosition = new THREE.Vector3();
                this.currentVelocity = new THREE.Vector3();
                if (this.el.object3D) this.el.object3D.getWorldPosition(this.lastPosition);
            },
            tick: function (time, timeDelta) {
                if (window.isGameOver || !timeDelta) return;
                let dt = timeDelta / 1000;
                let currentPosition = new THREE.Vector3();
                this.el.object3D.getWorldPosition(currentPosition);
                this.currentVelocity.subVectors(currentPosition, this.lastPosition).divideScalar(dt);
                this.lastPosition.copy(currentPosition);
                if (currentPosition.y <= 0.4 && this.currentVelocity.y < -1.5) {
                    let locomotion = this.playerRig.components['gtag-physics-locomotion'];
                    if (locomotion) {
                        let pushForce = new THREE.Vector3(-this.currentVelocity.x * 0.5, Math.abs(this.currentVelocity.y) * 0.9, -this.currentVelocity.z * 0.5);
                        locomotion.pushPlayer(pushForce);
                    }
                }
            }
        });

        window.triggerPlayerDeath = function(message) {
            if (window.isGameOver) return;
            window.isGameOver = true;
            document.querySelector('#death-message').innerText = message;
            document.querySelector('#jumpscare-screen').style.display = 'flex';
        };
    </script>
</head>
<body style="margin: 0; padding: 0; overflow: hidden; background-color: #000;">

    <div id="jumpscare-screen" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: #ff0000; z-index: 9999; font-family: sans-serif; flex-direction: column; justify-content: center; align-items: center;">
        <h1 id="death-message">🚨 GAME OVER 🚨</h1>
        <button onclick="window.location.reload()" style="padding: 10px 20px; font-size: 1.5rem; background: red; color: #fff; border: none; cursor: pointer;">RESTART</button>
    </div>

    <a-scene>
        <a-sky id="skyBox" color="#87CEEB"></a-sky>
        <a-plane position="0 0 0" rotation="-90 0 0" width="100" height="100" color="#11aa44"></a-plane>
        <a-box position="0 1 -5" width="1" height="1" depth="1" color="#ff0000"></a-box>

        
            
            
            
        
    </a-scene>

</body>
</html>
