<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Gorilla Arena Escape: True Layout Build</title>
    
    <!-- Stable production loading for the A-Frame core framework -->
    <script src="https://aframe.io"></script>

    <!-- Custom Gorilla Tag framework scripts running natively in engine -->
    <script>
        window.isGameOver = false;

        // --- DAY/NIGHT TOGGLE SYSTEM ---
        AFRAME.registerComponent('day-night-toggle', {
            init: function () {
                this.isDay = true;
                this.ambientLight = document.querySelector('#ambientLight');
                this.sunLight = document.querySelector('#sunLight');
                this.sky = document.querySelector('#skyBox');
                
                window.toggleDayNight = () => {
                    if (window.isGameOver) return;
                    this.isDay = !this.isDay;
                    if (this.isDay) {
                        this.ambientLight.setAttribute('color', '#bbbbbb');
                        this.sunLight.setAttribute('intensity', '0.8');
                        this.sunLight.setAttribute('color', '#ffffff');
                        this.sky.setAttribute('color', '#1a1a24');
                    } else {
                        this.ambientLight.setAttribute('color', '#05050f');
                        this.sunLight.setAttribute('intensity', '0.1');
                        this.sunLight.setAttribute('color', '#ff0055');
                        this.sky.setAttribute('color', '#020205');
                    }
                };
            }
        });

        // --- VR CONTROLLER TRIGGER WATCHER ---
        AFRAME.registerComponent('vr-trigger-watch', {
            init: function () {
                this.el.addEventListener('triggerdown', function (evt) {
                    if (window.toggleDayNight) window.toggleDayNight();
                });
            }
        });

        // --- FLASHLIGHT ORIENTATION TRACKING ---
        AFRAME.registerComponent('flashlight-track', {
            init: function () {
                this.camera = document.querySelector('#camera');
            },
            tick: function () {
                if (window.isGameOver) return;
                if (this.camera) {
                    this.el.object3D.rotation.copy(this.camera.object3D.rotation);
                }
            }
        });

        // --- GORILLA TAG STYLE PHYSICS LOCOMOTION ---
        AFRAME.registerComponent('gtag-locomotion', {
            init: function () {
                this.velocity = new THREE.Vector3(0, 0, 0);
                this.isGrounded = false;
                this.gravity = -9.8;
                this.friction = 0.96;
                this.camera = document.querySelector('#camera');

                window.addEventListener('mousedown', () => {
                    if (!this.el.sceneEl.is('vr-mode')) {
                        this.pushPlayer(new THREE.Vector3(0, 4.5, -5.5));
                    }
                });
            },
            tick: function (time, timeDelta) {
                if (window.isGameOver) return;
                if (!timeDelta) return;
                let dt = timeDelta / 1000;
                let pos = this.el.object3D.position;

                if (!this.isGrounded) {
                    this.velocity.y += this.gravity * dt;
                }

                this.velocity.x *= this.friction;
                this.velocity.z *= this.friction;

                pos.addScaledVector(this.velocity, dt);

                if (pos.y <= 0) {
                    pos.y = 0;
                    this.velocity.y = 0;
                    this.isGrounded = true;
                }
            },
            pushPlayer: function(forceVector) {
                if (window.isGameOver || !this.camera) return;
                var direction = new THREE.Vector3();
                this.camera.object3D.getWorldDirection(direction);
                
                this.velocity.x = -direction.x * forceVector.z;
                this.velocity.y = forceVector.y;
                this.velocity.z = -direction.z * forceVector.z;
                this.isGrounded = false;
            }
        });

        // --- VR HAND PUSH MECHANIC ---
        AFRAME.registerComponent('vr-gtag-hand-push', {
            init: function () {
                this.playerRig = document.querySelector('#player');
                this.lastPosition = new THREE.Vector3();
                this.currentVelocity = new THREE.Vector3();
                this.el.object3D.getWorldPosition(this.lastPosition);
            },
            tick: function (time, timeDelta) {
                if (window.isGameOver || !timeDelta) return;
                let dt = timeDelta / 1000;

                let currentPosition = new THREE.Vector3();
                this.el.object3D.getWorldPosition(currentPosition);

                this.currentVelocity.subVectors(currentPosition, this.lastPosition).divideScalar(dt);
                this.lastPosition.copy(currentPosition);

                let handWorldY = currentPosition.y;

                if (handWorldY <= 0.4 && this.currentVelocity.y < -1.5) {
                    let locomotion = this.playerRig.components['gtag-locomotion'];
                    if (locomotion) {
                        let pushForce = new THREE.Vector3(
                            -this.currentVelocity.x * 0.4,
                            Math.abs(this.currentVelocity.y) * 0.8, 
                            -this.currentVelocity.z * 0.4
                        );
                        
                        pushForce.x = Math.max(-8, Math.min(8, pushForce.x));
                        pushForce.y = Math.max(2, Math.min(7, pushForce.y));
                        pushForce.z = Math.max(-8, Math.min(8, pushForce.z));

                        locomotion.pushPlayer(pushForce);
                    }
                }
            }
        });

        // --- DOOR OPENER SYSTEM ---
        AFRAME.registerComponent('door-opener', {
            init: function () {
                this.door = document.querySelector('#hallwayDoor');
                this.isOpened = false;
                this.el.addEventListener('click', () => {
                    if (this.isOpened) return;
                    this.isOpened = true;
                    // Animates the security door upward out of the way
                    this.door.setAttribute('animation', 'property: position; to: 0 6.5 -20; dur: 1500; easing: easeOutQuad');
                    this.el.setAttribute('color', '#00ff00'); 
                });
            }
        });

        // --- METHOD TO TRIGGER DEATH OVERLAYS ---
        window.triggerPlayerDeath = function(message) {
            window.isGameOver = true;
            document.querySelector('#death-message').innerText = message;
            document.querySelector('#jumpscare-screen').style.display = 'flex';
            
            let sceneEl = document.querySelector('a-scene');
            let flash = document.createElement('a-sky');
            flash.setAttribute('color', '#ff0000');
            sceneEl.appendChild(flash);
        };

        // --- FALLING SPIKE ROOF SYSTEM (UPDATED ACCORDING TO YOUR ORIGINAL CODE) ---
        AFRAME.registerComponent('spiked-roof-trap', {
            init: function () {
                this.player = document.querySelector('#player');
                this.trapState = 'IDLE'; 
                this.timer = 0;
                this.trapInterval = 30; // Triggers every 30 seconds straight out of your original code
                this.warningDuration = 3.0; 
                this.dropSpeed = 15.0; 
                this.retractSpeed = 1.5; 
                this.initialY = 9.0;
                this.lowestY = 1.5; 
                this.trapLight = document.querySelector('#trapLight');
            },
            tick: function (time, timeDelta) {
                if (window.isGameOver) return;
                if (!timeDelta) return;
                let dt = timeDelta / 1000;
                let pos = this.el.object3D.position;

                this.timer += dt;

                if (this.trapState === 'IDLE' && this.timer >= this.trapInterval) {
                    this.trapState = 'WARNING';
                    this.timer = 0;
                    this.trapLight.setAttribute('light', 'color: #ff0000; intensity: 2');
                }
                
                else if (this.trapState === 'WARNING' && this.timer >= this.warningDuration) {
                    this.trapState = 'DROPPING';
                    this.timer = 0;
                }
                
                else if (this.trapState === 'DROPPING') {
                    pos.y -= this.dropSpeed * dt;
                    if (pos.y <= this.lowestY) {
                        pos.y = this.lowestY;
                        this.trapState = 'CRUSHED';
                        this.timer = 0;
                    }
                    this.checkCrushCollision();
                }
                
                else if (this.trapState === 'CRUSHED' && this.timer >= 2.0) {
                    this.trapState = 'RETRACTING';
                    this.timer = 0;
                    this.trapLight.setAttribute('light', 'color: #333; intensity: 0.5');
                }
                
                else if (this.trapState === 'RETRACTING') {
                    pos.y += this.retractSpeed * dt;
                    if (pos.y >= this.initialY) {
                        pos.y = this.initialY;
                        this.trapState = 'IDLE';
                        this.timer = 0;
                    }
                }

                if (this.trapState === 'WARNING') {
                    let flash = Math.sin(time / 100) > 0;
                    this.trapLight.setAttribute('light', 'intensity', flash ? 2 : 0);
                }
            },
