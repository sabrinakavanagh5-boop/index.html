<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Terrified Monkes</title>
    
    <!-- Stable production loading for the A-Frame core framework -->
    <script src="https://aframe.io"></script>

    <!-- --- JAVASCRIPT GAME ENGINE BLOCK --- -->
    <script>
        window.isGameOver = false;

        // --- GORILLA TAG LOCOMOTION & GRAVITY PHYSICS ---
        AFRAME.registerComponent('gtag-physics-locomotion', {
            init: function () {
                this.velocity = new THREE.Vector3(0, 0, 0);
                this.isGrounded = false;
                this.gravity = -9.8;
                this.friction = 0.96; // Air resistance to slow down drifts
                this.camera = document.querySelector('#camera');

                // Desktop / Mobile Fallback (Click mouse/tap screen to jump forward)
                window.addEventListener('mousedown', () => {
                    if (!this.el.sceneEl.is('vr-mode') && !window.isGameOver) {
                        this.pushPlayer(new THREE.Vector3(0, 4.5, -5.5));
                    }
                });
            },
            tick: function (time, timeDelta) {
                if (window.isGameOver || !timeDelta) return;
                let dt = timeDelta / 1000;
                let pos = this.el.object3D.position;

                // Apply constant falling gravity
                if (!this.isGrounded) {
                    this.velocity.y += this.gravity * dt;
                }

                // Apply surface friction
                this.velocity.x *= this.friction;
                this.velocity.z *= this.friction;

                pos.addScaledVector(this.velocity, dt);

                // Stop at the floor bounds (Y = 0)
                if (pos.y <= 0) {
                    pos.y = 0;
                    this.velocity.y = 0;
                    this.isGrounded = true;
                }
            },
            pushPlayer: function(forceVector) {
                if (window.isGameOver) return;
                this.velocity.add(forceVector);
                this.isGrounded = false;
            }
        });

        // --- VR CONTROLLER VELOCITY & SURFACES PUSH TRIGGER ---
        AFRAME.registerComponent('vr-hand-push-trigger', {
            init: function () {
                this.playerRig = document.querySelector('#player');
                this.lastPosition = new THREE.Vector3();
                this.currentVelocity = new THREE.Vector3();
                
                // Wait for object3D to sit tightly in world space
                if (this.el.object3D) {
                    this.el.object3D.getWorldPosition(this.lastPosition);
                }
            },
            tick: function (time, timeDelta) {
                if (window.isGameOver || !timeDelta) return;
                let dt = timeDelta / 1000;

                let currentPosition = new THREE.Vector3();
                this.el.object3D.getWorldPosition(currentPosition);

                // Math: Calculate frame-by-frame controller speed
                this.currentVelocity.subVectors(currentPosition, this.lastPosition).divideScalar(dt);
                this.lastPosition.copy(currentPosition);

                let handWorldY = currentPosition.y;

                // If hand slaps downward rapidly near the floor, launch player upward and forward
                if (handWorldY <= 0.4 && this.currentVelocity.y < -1.5) {
                    let locomotion = this.playerRig.components['gtag-physics-locomotion'];
                    if (locomotion) {
                        let pushForce = new THREE.Vector3(
                            -this.currentVelocity.x * 0.5,
                            Math.abs(this.currentVelocity.y) * 0.9, 
                            -this.currentVelocity.z * 0.5
                        );
                        
                        // Clamp forces so you stay inside the map geometry limits
                        pushForce.x = Math.max(-10, Math.min(10, pushForce.x));
                        pushForce.y = Math.max(3, Math.min(8, pushForce.y));
                        pushForce.z = Math.max(-10, Math.min(10, pushForce.z));

                        locomotion.pushPlayer(pushForce);
                    }
                }
            }
        });

        // --- INTERACTIVE DOOR SWITCH TERMINAL ---
        AFRAME.registerComponent('door-opener', {
            init: function () {
                this.door = document.querySelector('#hallwayDoor');
                this.isOpened = false;
                this.el.addEventListener('click', () => {
                    if (this.isOpened || !this.door) return;
                    this.isOpened = true;
                    // Slide the massive security wall straight into the roof
                    this.door.setAttribute('animation', 'property: position; to: 0 11 12; dur: 1500; easing: easeOutQuad');
                    this.el.setAttribute('color', '#00ff00'); // Turn green on success
                });
            }
        });

        // --- LIVE SPIKE TRAP COLLISION DETECTION ---
        AFRAME.registerComponent('spiked-roof-trap', {
            init: function () {
                this.player = document.querySelector('#player');
            },
            tick: function () {
                if (window.isGameOver || !this.player) return;
                
                let trapPos = this.el.object3D.position;
                let playerPos = this.player.object3D.position;

                // Math: Calculate if player is under the hazard footprint
                let distanceX = Math.abs(trapPos.x - playerPos.x);
                let distanceZ = Math.abs(trapPos.z - playerPos.z);
                
                // If you are inside the trap footprint, and it drops past head level (1.8m) -> Trigger Game Over!
                if (distanceX < 6 && distanceZ < 15 && trapPos.y <= (playerPos.y + 1.8)) {
                    window.triggerPlayerDeath("🦧 CRUSHED BY THE ARENA CEILING! 🚨");
                }
            }
        });

        // --- SYSTEM GAME OVER METHOD ---
        window.triggerPlayerDeath = function(message) {
            if (window.isGameOver) return;
            window.isGameOver = true;
            document.querySelector('#death-message').innerText = message;
            document.querySelector('#jumpscare-screen').style.display = 'flex';
            
            // Turn the whole VR environment red
            let sceneEl = document.querySelector('a-scene');
            let flash = document.createElement('a-sky');
            flash.setAttribute('color', '#ff0000');
            sceneEl.appendChild(flash);
        };
    </script>
</head>
<body>

    <!-- 1. JUMPSCARE GAME OVER UI OVERLAY -->
    <div id="jumpscare-screen" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: black; color: red; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; font-family: sans-serif;">
        <h1 id="death-message" style="font-size: 3rem; text-align: center; margin-bottom: 20px;">🚨 GAME OVER 🚨</h1>
        <button onclick="window.location.reload()" style="padding: 15px 30px; font-size: 1.5rem; background-color: red; color: white; border: none; cursor: pointer; border-radius: 5px;">RESTART RUN</button>
    </div>

    <!-- 2. MAIN 3D ENGINE SCENE -->
    <!-- Removed timeout requirements so it boots instantly even if assets are weird -->
    <a-scene pool__enemy="mixin: enemyMesh; size: 10">
        
        <!-- REMOVED THE BROKEN GLTF TO PREVENT WHITE VOID HANGS -->
        <a-assets></a-assets>

        <!-- ENVIRONMENT SETUP -->
        <a-sky id="skyBox" color="#1a1a24"></a-sky>
        <a-plane position="0 0 0" rotation="-90 0 0" width="200" height="200" color="#222" metalness="0.4"></a-plane>

        <!-- MAP LAYOUT AREA 1: THE EXTENDED SPAWN LOBBY -->
        <a-box position="-6 4 30" width="0.5" height="8" depth="36" color="#333" metalness="0.7"></a-box>
        <a-box position="6 4 30" width="0.5" height="8" depth="36" color="#333" metalness="0.7"></a-box>
        <a-box position="0 4 48" width="12" height="8" depth="0.5" color="#222" metalness="0.8"></a-box>

        <!-- Access Button Switch Terminal -->
        <a-box id="unlockButton" door-opener position="2 1.2 12.5" width="0.4" height="0.4" depth="0.4" color="#ff0000"></a-box>

        <!-- The Target Security Door -->
        <a-box id="hallwayDoor" position="0 4 12" width="12" height="8" depth="1" color="#444" metalness="0.9"></a-box>

        <!-- Moving Hazard: Spiked Roof Trap -->
        <a-box id="spikeTrap" spiked-roof-trap position="0 7 25" width="11.5" height="1" depth="20" color="#553333"
               animation="property: position; from: 0 7 25; to: 0 1 25; dur: 5000; dir: alternate; loop: true; easing: linear"></a-box>

        <!-- --- PLAYER RIG WITH LOCOMOTION COMPONENTS --- -->
        
            <!-- Head Camera -->
            
                <a-cursor id="mouseCursor" raycaster="objects: [door-opener]" material="color: white; shader: flat" position="0 0 -1"></a-cursor>
            
            
            <!-- Left Hand Tracked Controller -->
            
                <a-sphere radius="0.1" color="#ff0000"></a-sphere>
            
            
            <!-- Right Hand Tracked Controller -->
            
                <a-sphere radius="0.1" color="#0000ff"></a-sphere>
            
        

    </a-scene>
</body>
</html>
