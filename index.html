<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Gorilla Escape: Cave Maze</title>
    <script src="https://aframe.io"></script>
    <script>
        // --- DAY/NIGHT TOGGLE SYSTEM ---
        AFRAME.registerComponent('day-night-toggle', {
            init: function () {
                this.isDay = false;
                this.ambientLight = document.querySelector('#ambientLight');
                this.sunLight = document.querySelector('#sunLight');
                
                window.toggleDayNight = () => {
                    this.isDay = !this.isDay;
                    if (this.isDay) {
                        this.ambientLight.setAttribute('color', '#bbbbbb');
                        this.sunLight.setAttribute('intensity', '0.8');
                        this.sunLight.setAttribute('color', '#ffffff');
                    } else {
                        this.ambientLight.setAttribute('color', '#110505');
                        this.sunLight.setAttribute('intensity', '0.2');
                        this.sunLight.setAttribute('color', '#ff0000');
                    }
                };
            }
        });

        // --- VR CONTROLLER TRIGGER WATCHER ---
        AFRAME.registerComponent('vr-trigger-watch', {
            init: function () {
                this.el.addEventListener('triggerdown', function (evt) {
                    if (window.toggleDayNight) window.toggleDayNight();
                });
            }
        });

        // --- FLASHLIGHT ORIENTATION TRACKING ---
        AFRAME.registerComponent('flashlight-track', {
            tick: function () {
                var camera = document.querySelector('#camera');
                if (camera) {
                    this.el.object3D.rotation.copy(camera.object3D.rotation);
                }
            }
        });

        // --- GORILLA TAG STYLE PHYSICS LOCOMOTION ---
        AFRAME.registerComponent('gtag-locomotion', {
            init: function () {
                this.velocity = new THREE.Vector3(0, 0, 0);
                this.isGrounded = false;
                this.gravity = -9.8;
                this.friction = 0.96;

                window.addEventListener('mousedown', () => {
                    this.pushPlayer(new THREE.Vector3(0, 4, -5)); 
                });
            },
            tick: function (time, timeDelta) {
                if (!timeDelta) return;
                let dt = timeDelta / 1000;
                let pos = this.el.object3D.position;

                if (!this.isGrounded) {
                    this.velocity.y += this.gravity * dt;
                }

                this.velocity.x *= this.friction;
                this.velocity.z *= this.friction;

                pos.addScaledVector(this.velocity, dt);

                if (pos.y <= 0) {
                    pos.y = 0;
                    this.velocity.y = 0;
                    this.isGrounded = true;
                }
            },
            pushPlayer: function(forceVector) {
                var direction = new THREE.Vector3();
                var camera = document.querySelector('#camera');
                camera.object3D.getWorldDirection(direction);
                
                this.velocity.x = -direction.x * forceVector.z;
                this.velocity.y = forceVector.y;
                this.velocity.z = -direction.z * forceVector.z;
                this.isGrounded = false;
            }
        });
    </script>
    <style>
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 9999;
        }
        .toggle-btn {
            padding: 12px 24px;
            background: #222;
            color: #fff;
            border: 2px solid #fff;
            font-family: sans-serif;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
        }
        .toggle-btn:hover { background: #444; }
    </style>
</head>
<body>
    <div id="ui-layer">
        <button class="toggle-btn" onclick="window.toggleDayNight()">Toggle Day/Night</button>
    </div>

    <a-scene day-night-toggle>
